aid: thread-ai
name: Thread AI
description: 'Thread AI builds AI orchestration infrastructure for the enterprise.
  Its platform, Lemma, is a composable AI infrastructure and workflow-orchestration
  layer for building and running production-grade AI agents and workflows in regulated,
  mission-critical operations. Lemma pairs a drag-and-drop workflow builder with a
  code-first SDK and REST, gRPC, and GraphQL API access, adding full audit trails,
  governance, human-in-the-loop approvals, and reliability controls across email,
  voice, text, transcription, document extraction, and system-update worker functions.
  Deployment options span VPC, on-premises, and multi-tenant SaaS, and the platform
  is SOC 2 Type 2, HIPAA, GDPR, CJIS, and CMMC 2.0 Level 1 aligned (CMMC 2.0 Level
  2 and FedRAMP underway). Thread AI is backed by Homebrew and Index Ventures.'
